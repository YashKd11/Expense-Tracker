<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body>
    <div id="main" class="bg-[#141414] w-screen min-h-screen h-screen flex flex-col gap-8 items-center">
        <div class="nav w-screen h-[6%] flex items-center justify-between">
            <div class="nav-1 flex items-center gap-4 text-white text-white">
                <div class="size-4">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z"
                            fill="currentColor"></path>
                    </svg>
                </div>
                <a href="/" class="text-white text-xl font-bold leading-tight tracking-[-0.015em]">Spendwise</a>
            </div>
            <div class="nav-2 flex items-center gap-4 text-white">
                <a href="/">Home</a>
                <a href="/add">Add Expense</a>
                <p class="bg-white text-black rounded-full px-4 py-2">{{ current_user.name[0] }}</p>
                <div class="flex items-center justify-center">
                    <form action="/logout" method="post" class="flex items-center justify-center my-2"><input
                            type="submit" value="Logout" class="bg-white text-black rounded-md px-6 py-2"></form>
                </div>
            </div>
        </div>

        <div class="flex items-center h-[90%] w-full">
            <div class="ai bg-slate-300 h-full w-1/3 "></div>
            <div class="highlights relative h-full w-2/3 flex flex-col items-center px-8 border-grey-400 border-2 rounded-md">
                <div class="flex max-w-[980px] h-[12%] w-full gap-4 px-4 py-3 relative bg-cyan-400">
                    <h1 class="font-black text-white text-5xl">Hi {{ current_user.name }}</h1>
                    <form action="/reports" method="get" class="flex gap-2 absolute right-5">
                        <select name="range" class="rounded px-3 py-2 bg-gray-800 text-white">
                            <option value="all" {% if selected_range=='all' %}selected{% endif %}>All Time</option>
                            <option value="today" {% if selected_range=='today' %}selected{% endif %}>Today</option>
                            <option value="week" {% if selected_range=='week' %}selected{% endif %}>Last 7 Days</option>
                            <option value="month" {% if selected_range=='month' %}selected{% endif %}>Last 30 Days
                            </option>
                        </select>

                        <button type="submit" class="bg-[#007FFF] py-2 px-5 text-white rounded text-sm ">Apply</button>
                    </form>
                </div>
                <div class="tabs h-[18%] w-full bg-indigo-300">

                </div>
            </div>
        </div>
</body>

</html>
